name: Opaw
options:
  bundleIdPrefix: app.opaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

fileGroups:
  - Config

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

packages:
  OpawKit:
    path: Packages/OpawKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.0"

targets:
  Opaw:
    type: application
    platform: iOS
    sources:
      - path: Opaw
      - path: Shared
    dependencies:
      - package: OpawKit
      - package: Supabase
        product: Supabase
      - target: OpawWidgets
    entitlements:
      path: Opaw/Opaw.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.opaw.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.opaw.Opaw
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Opaw
    info:
      path: Opaw/Info.plist
      properties:
        CFBundleDisplayName: Opaw
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad runs so the two-pane open-display layouts can be tried in the simulator.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Opaw uses your location to record your dog's walks and show dogs nearby.
        NSLocationAlwaysAndWhenInUseUsageDescription: Opaw keeps recording your walk while your phone is locked.
        NSCameraUsageDescription: Opaw uses the camera to photograph your dog for their avatar and memories.
        NSPhotoLibraryAddUsageDescription: Opaw can save memories to your photo library.
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        AppGroupID: group.app.opaw.shared
        UIAppFonts:
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf

  OpawWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OpawWidgets
      - path: Shared
    dependencies:
      - package: OpawKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: OpawWidgets/OpawWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.opaw.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.opaw.Opaw.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Opaw Widgets
    info:
      path: OpawWidgets/Info.plist
      properties:
        CFBundleDisplayName: Opaw Widgets
        AppGroupID: group.app.opaw.shared
        UIAppFonts:
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
          - Nunito-ExtraBold.ttf
          - Nunito-Black.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Opaw:
    build:
      targets:
        Opaw: all
        OpawWidgets: all
    run:
      config: Debug
      storeKitConfiguration: Config/Opaw.storekit
    archive:
      config: Release
